
<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Szelesdomb FM – Online Rádió</title>
    <meta name="description" content="Hallgasd élőben a Szelesdomb FM online rádiót!">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101820, #263746);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 55px 20px 30px;
        }

        header h1 {
            font-size: 42px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        header p {
            color: #b9c8d5;
            font-size: 16px;
        }

        .live {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 18px;
            background: #d62828;
            border-radius: 25px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        main {
            width: 100%;
            max-width: 700px;
            margin: auto;
            padding: 20px;
        }

        .radio-container {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }

        .radio-container h2 {
            font-size: 23px;
            margin-bottom: 20px;
        }

        iframe {
            display: block;
            width: 100%;
            min-height: 150px;
            height: 150px;
            border: 0;
        }

        footer {
            text-align: center;
            padding: 25px 15px;
            color: #8798a7;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            header h1 {
                font-size: 32px;
            }

            .radio-container {
                padding: 25px 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>SZELESDOMB FM</h1>
        <p>Az online rádió, ami mindig veled van.</p>
        <div class="live">● ÉLŐ ADÁS</div>
    </header>

    <main>
        <div class="radio-container">
            <h2>Hallgasd élőben!</h2>

            <iframe src="link"
                frameborder="0"
                allowtransparency="true"
                style="width: 100%; min-height: 150px; height: 150px; border: 0;">
            </iframe>

        </div>
    </main>

    <footer>
        © 2026 Szelesdomb FM – Minden jog fenntartva.
    </footer>

</body>
</html>
